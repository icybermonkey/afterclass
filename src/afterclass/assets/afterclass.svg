<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>afterclass app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cf0"/>
      <stop offset="1" stop-color="#2459c2"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eeff"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7de8"/>
      <stop offset="1" stop-color="#2f6fdb"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6bd16"/>
      <stop offset="1" stop-color="#e0a100"/>
    </linearGradient>
    <filter id="shadow-body" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0a1b45" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1b45" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g id="icon-body">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)" filter="url(#shadow-body)"/>
    <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>

  <g id="page">
    <rect x="232" y="212" width="560" height="600" rx="56" ry="56" fill="url(#page)" filter="url(#shadow-soft)"/>
  </g>

  <g id="slide">
    <rect x="272" y="252" width="480" height="270" rx="30" ry="30" fill="url(#slide)"/>
    <!-- play triangle: recording becomes something you can revisit -->
    <polygon id="play" points="482,330 482,444 582,387" fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <g id="text-lines">
    <!-- yellow highlight = your own note -->
    <rect id="highlight" x="258" y="620" width="400" height="60" rx="16" ry="16" fill="#ffe58a"/>
    <rect x="272" y="566" width="470" height="28" rx="14" ry="14" fill="#9fb8e6"/>
    <rect x="272" y="636" width="370" height="28" rx="14" ry="14" fill="#5c7fc4"/>
    <rect x="272" y="706" width="250" height="28" rx="14" ry="14" fill="#9fb8e6"/>
  </g>

  <g id="bookmark" filter="url(#shadow-soft)">
    <path d="M628 166 H716 V452 L672 410 L628 452 Z" fill="url(#ribbon)" stroke-linejoin="round"/>
  </g>
</svg>
