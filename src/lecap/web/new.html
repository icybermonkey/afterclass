<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lecap · new lesson</title>
<link rel="icon" href="__ICON__">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0; --accent: #4f46e5; --accent-soft: #e8e7fd;
  --ok: #1f8a4c; --ok-soft: #e3f4ea; --on: #c25e00; --on-soft: #fdeedd; --bad: #c0392b; --drop: #f0f0fe;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151517; --panel: #1c1c1f; --fg: #ececee; --muted: #9a9aa2; --line: #2e2e33; --accent: #8b85ff; --accent-soft: #25234a;
    --ok: #4cc27f; --ok-soft: #16301f; --on: #ff9f4a; --on-soft: #3a2511; --bad: #ff7b6b; --drop: #1f1e33; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 20px 24px 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
header img { width: 44px; height: 44px; }
header h1 { font-size: 20px; margin: 0; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
header .gear { margin-left: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 10px; color: var(--muted); }
.drops { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--drop); padding: 18px 16px; min-height: 130px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; transition: border-color .15s, background .15s; }
.drop.hover { border-color: var(--accent); }
.drop.set { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.drop .big { font-size: 26px; line-height: 1; }
.drop b { font-size: 15px; }
.drop .file { font-weight: 600; word-break: break-all; }
.drop .sub { font-size: 12px; color: var(--muted); }
.drop .row { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 12px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 8px 22px; font-size: 15px; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.small { font-size: 12px; padding: 2px 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.field { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; }
.field label { font-weight: 600; font-size: 13px; }
.field input[type=text], select { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 8px; overflow-x: auto; white-space: nowrap; }
.target { font-size: 12px; color: var(--muted); grid-column: 2 / 4; margin-top: -2px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding-top: 8px; }
.opts label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.opts select { width: auto; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; border-radius: 4px; padding: 1px 5px; text-transform: uppercase; }
.tag.off { color: var(--ok); background: var(--ok-soft); }
.tag.on { color: var(--on); background: var(--on-soft); }
.runbar { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.runbar .msg { color: var(--bad); font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0; }
.bar div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.status { display: flex; gap: 10px; align-items: baseline; }
.status b { font-size: 15px; }
.status .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
details.log summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
details.log pre { max-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  font-size: 11px; line-height: 1.45; white-space: pre-wrap; }
.done { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.err { color: var(--bad); }
@media (max-width: 700px) { .drops { grid-template-columns: 1fr; } .field { grid-template-columns: 1fr; } .target { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <img src="__ICON__" alt="">
  <div><h1>New lesson</h1><p>Drop the recording (and the slides), choose where it goes, press Run.</p></div>
  <button class="gear" id="settings" title="Settings (models, defaults, keys)">⚙ Settings</button>
</header>

<div class="drops">
  <div class="drop" id="drop-video">
    <div class="big">🎬</div>
    <div class="empty"><b>Drop the recording here</b><div class="sub">.mp4 · .mov · .m4v · .mkv</div></div>
    <div class="file hidden"></div>
    <div class="row"><button class="btn small" data-choose="video">Choose…</button><button class="btn small hidden" data-clear="video">Remove</button></div>
  </div>
  <div class="drop" id="drop-deck">
    <div class="big">🖼</div>
    <div class="empty"><b>Slides</b> <span class="muted">(optional)</span><div class="sub">.pdf · .pptx: sharp slides, exact text, chapters</div></div>
    <div class="file hidden"></div>
    <div class="row"><button class="btn small" data-choose="deck">Choose…</button><button class="btn small hidden" data-clear="deck">Remove</button></div>
  </div>
</div>

<div class="card">
  <div class="field"><label>Output folder</label><div class="path" id="outdir"></div><button class="btn small" data-choose="folder">Choose…</button></div>
  <div class="field"><label>Lesson name</label><input type="text" id="name" placeholder="from the file name"><span></span>
    <div class="target" id="target"></div></div>
  <div class="opts">
    <label>Language <select id="language">
      <option value="en">English</option><option value="de">German</option><option value="fr">French</option>
      <option value="it">Italian</option><option value="es">Spanish</option></select></label>
    <label>AI extras <select id="ai">
      <option value="auto">Automatic (local first)</option><option value="local">Local model</option>
      <option value="claude-code">Claude Code (subscription)</option><option value="claude">Claude API (pay per use)</option>
      <option value="off">Off</option></select> <span id="aitag"></span></label>
    <label id="costwrap" class="hidden"><input type="checkbox" id="cost"> I accept the API cost (≈ $0.35)</label>
    <label><input type="checkbox" id="speakers" checked> Tell speakers apart</label>
  </div>
</div>

<div class="runbar">
  <button class="btn primary" id="run" disabled>Run</button>
  <span class="msg" id="msg"></span>
</div>

<div class="card hidden" id="progress">
  <div class="status"><b id="step">Starting…</b><span class="muted" id="detail"></span><span class="time" id="time">0:00</span></div>
  <div class="bar"><div id="fill"></div></div>
  <div class="done hidden" id="done">
    <button class="btn primary" id="open">Open lesson</button>
    <button class="btn" id="reveal">Show in Finder</button>
    <button class="btn" id="again">New lesson</button>
  </div>
  <div class="done" id="running"><button class="btn" id="cancel">Cancel</button></div>
  <details class="log"><summary>Details</summary><pre id="log"></pre></details>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const form = { video: "", deck: "", out_dir: "", name: "", language: "en", ai: "auto", accept_cost: false, speakers: true };
let api = null, next = 0, timer = null;
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function setFile(kind, info) {
  if (kind === "folder") { form.out_dir = info ? info.path : ""; $("#outdir").textContent = form.out_dir || "—"; return refresh(); }
  form[kind] = info ? info.path : "";
  const box = $("#drop-" + kind);
  box.classList.toggle("set", !!info);
  box.querySelector(".empty").classList.toggle("hidden", !!info);
  box.querySelector(".file").classList.toggle("hidden", !info);
  box.querySelector("[data-clear]").classList.toggle("hidden", !info);
  if (info) box.querySelector(".file").textContent = `${info.name}${info.mb ? ` · ${info.mb} MB` : ""}`;
  if (kind === "video" && info && !$("#name").value) $("#name").placeholder = info.name.replace(/\.[^.]+$/, "");
  refresh();
}
// Called from Python when files are dropped anywhere on the window (with their real paths)
window.lecapDropped = info => {
  if (!info.kind) { $("#msg").textContent = `${info.name}: not a video, slide deck or folder`; return; }
  $("#msg").textContent = "";
  setFile(info.kind, info);
};
async function refresh() {
  form.name = $("#name").value.trim();
  form.language = $("#language").value;
  form.ai = $("#ai").value;
  form.accept_cost = $("#cost").checked;
  form.speakers = $("#speakers").checked;
  $("#aitag").innerHTML = form.ai === "off" ? "" : ["auto", "local"].includes(form.ai) ? `<span class="tag off">offline</span>` : `<span class="tag on">online</span>`;
  $("#costwrap").classList.toggle("hidden", form.ai !== "claude");
  if (api) {
    const p = await api.preview(form);
    $("#target").textContent = p.out ? `→ ${p.out}  (${p.state})` : "";
  }
  const ready = form.video && form.out_dir && !(form.ai === "claude" && !form.accept_cost);
  $("#run").disabled = !ready;
  $("#msg").textContent = !form.video ? "" : !form.out_dir ? "Choose an output folder" : form.ai === "claude" && !form.accept_cost ? "Confirm the API cost, or pick another AI option" : "";
}
["#name", "#language", "#ai", "#cost", "#speakers"].forEach(s => $(s).addEventListener(s === "#name" ? "input" : "change", refresh));

document.addEventListener("click", async e => {
  const c = e.target.closest("[data-choose]"), x = e.target.closest("[data-clear]");
  if (c && api) { const info = await api.choose(c.dataset.choose); if (info) setFile(c.dataset.choose === "folder" ? "folder" : c.dataset.choose, info); }
  if (x) setFile(x.dataset.clear, null);
});
// keep the browser from opening dropped files itself; the real drop is handled by Python
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  const box = e.target.closest(".drop");
  document.querySelectorAll(".drop").forEach(d => d.classList.toggle("hover", d === box));
}));
document.addEventListener("dragleave", e => { if (!e.relatedTarget) document.querySelectorAll(".drop").forEach(d => d.classList.remove("hover")); });
document.addEventListener("drop", e => { e.preventDefault(); document.querySelectorAll(".drop").forEach(d => d.classList.remove("hover")); });

$("#run").onclick = async () => {
  const r = await api.run(form);
  if (r.error) { $("#msg").textContent = r.error; return; }
  next = 0; $("#log").textContent = `$ ${r.command}\n`;
  $("#progress").classList.remove("hidden"); $("#done").classList.add("hidden"); $("#running").classList.remove("hidden");
  $("#run").disabled = true; $("#step").textContent = "Starting…"; $("#detail").textContent = ""; $("#fill").style.width = "2%";
  timer = setInterval(poll, 700);
};
async function poll() {
  const p = await api.poll(next);
  next = p.next;
  for (const raw of p.lines) {
    const line = raw.trim();
    if (!line) continue;
    const step = line.match(/^\[(\d+)\/(\d+)\]\s+(.+)/);
    const pct = line.match(/(\d+)%\|/);
    if (step) {
      $("#step").textContent = step[3]; $("#detail").textContent = "";
      $("#fill").style.width = `${Math.max(2, (+step[1] - 1) / +step[2] * 100)}%`;
    } else if (pct) {
      $("#detail").textContent = `${pct[1]} %`;  // progress bars (Whisper, slides): shown, not logged
      continue;
    } else if (/^(Fetching|Downloading)/.test(line)) continue;
    $("#log").textContent += raw + "\n";
  }
  $("#log").scrollTop = $("#log").scrollHeight;
  $("#time").textContent = fmtTime(p.elapsed);
  if (p.state !== "running") {
    clearInterval(timer);
    $("#running").classList.add("hidden");
    $("#run").disabled = false;
    if (p.state === "done") {
      $("#step").textContent = "✔ Done"; $("#detail").textContent = p.out; $("#fill").style.width = "100%";
      $("#done").classList.remove("hidden");
    } else {
      const err = $("#log").textContent.split("\n").reverse().find(l => /^Error:|error/i.test(l.trim()));
      $("#step").innerHTML = p.state === "cancelled" ? "Cancelled" : `<span class="err">Failed</span>`;
      $("#detail").textContent = err ? err.trim() : "see Details";
      document.querySelector("details.log").open = p.state !== "cancelled";
    }
  }
}
$("#cancel").onclick = () => api.cancel();
$("#open").onclick = () => api.open_lesson();
$("#reveal").onclick = () => api.reveal();
$("#settings").onclick = () => api.settings();
$("#again").onclick = async () => { await api.reset(); $("#progress").classList.add("hidden"); setFile("video", null); setFile("deck", null); $("#name").value = ""; refresh(); };

window.addEventListener("pywebviewready", async () => {
  api = window.pywebview.api;
  const d = await api.defaults();
  $("#language").value = d.language; $("#ai").value = d.ai; $("#speakers").checked = d.speakers;
  form.out_dir = d.out_dir; $("#outdir").textContent = d.out_dir;
  refresh();
});
</script>
</body>
</html>
