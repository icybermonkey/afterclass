[project]
name = "afterclass"
version = "0.4.0"
description = "Turn a lecture recording (and optionally its slide deck) into a searchable study page"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mlx-whisper>=0.4",
    "scenedetect>=0.7",
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "keyring>=25",
    "speechbrain>=1.1.2",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[project.scripts]
# The command name lives here and in afterclass.APP_NAME (see README, "Rename the tool")
afterclass = "afterclass.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afterclass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
