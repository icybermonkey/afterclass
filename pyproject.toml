[project]
name = "lecap"
version = "0.1.0"
description = "Turn a lecture recording (and optionally its slide deck) into a searchable study page"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mlx-whisper>=0.4",
    "scenedetect>=0.7",
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "keyring>=25",
    "speechbrain>=1.1.2",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]

[project.scripts]
# The command name lives here and in lecap.APP_NAME (see README, "Rename the tool")
lecap = "lecap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
